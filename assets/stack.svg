<desc id="d">Tech stack. languages: Python, C++, C, JavaScript. data: NumPy, Pandas. frameworks: Streamlit, React, Vite. web: HTML, CSS. AI / APIs: OpenRouter, Backboard, OpenAI, Claude. backend: Supabase. tools: Git, GitHub, GitHub Actions. learning: Machine Learning, AI/ML Engineering.</desc>
