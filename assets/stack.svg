<title id="t">Tech stack</title>
<desc id="d">Tech stack. languages: Python, C, C++, JavaScript. data: NumPy, Pandas. frameworks: Streamlit, React, Vite. web / api: Next.js, Node.js, Zod, Tailwind CSS. ai / platform: OpenAI, OpenRouter, Backboard, Supabase. tools: Git, GitHub, GitHub Actions. learning: Machine Learning, AI/ML Engineering.</desc>
